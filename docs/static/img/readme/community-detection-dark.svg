<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="comm-dark-title comm-dark-desc">
<title id="comm-dark-title">Community detection and theme search</title>
<desc id="comm-dark-desc">Entities joined by relations weighted by their supporting passages are clustered with Leiden. Each community gets a report with a title, summary and findings, and the report is embedded. A broad question is matched against the reports in theme search, which returns the passages behind each matching theme.</desc>
<style>
.panel{fill:#17181c;stroke:#2a2d33}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#a8a29e}
.box{fill:#24262b;stroke:#3b3f46}
.box-title{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.box-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e}
.chip{fill:#1e2025;stroke:#3b3f46}
.chip-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.chip-tag{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7aa7ff}
.node{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25}
.node-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.node-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e}
.focal{fill:#7aa7ff;stroke:#7aa7ff;stroke-width:1.25}
.focal-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#111827}
.focal-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#111827;opacity:.85}
.bar{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25}
.edge{fill:none;stroke:#a8a29e;stroke-width:1.5}
.edge-blue{fill:none;stroke:#7aa7ff;stroke-width:1.5}
.edge-dash{fill:none;stroke:#7aa7ff;stroke-width:1.5;stroke-dasharray:5 4}
.edge-soft{fill:none;stroke:#a8a29e;stroke-width:1.25;stroke-dasharray:5 4}
.elabel{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e;letter-spacing:.04em}
.elabel-blue{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7aa7ff;letter-spacing:.04em}
.mask{fill:#17181c}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#a8a29e}
.arrowhead{fill:#a8a29e}
.arrowhead-blue{fill:#7aa7ff}
.glyph-page{fill:#1e2025;stroke:#3b3f46;stroke-width:1.5}
.glyph-line{fill:#3b3f46}
.span{fill:#1b2438;stroke:#7aa7ff;stroke-width:1}
.span-text{font:600 10px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.badge{fill:#7aa7ff}
.badge-text{font:600 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#111827}

.big{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.small{font:11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e}
.dot{fill:#7aa7ff}
.blob{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25;stroke-dasharray:4 3}
.gnode{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25}
.gedge{fill:none;stroke:#a8a29e;stroke-linecap:round}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#a8a29e}


@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<marker id="ah-comm-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="239" rx="10"/>

<g class="c-nodes">
<rect class="box" x="24" y="76" width="152" height="108" rx="8"/>
<text class="big" x="36" y="68">Entities</text>
<circle class="gnode" cx="46" cy="112" r="8"/><circle class="gnode" cx="92" cy="96" r="8"/><circle class="gnode" cx="138" cy="118" r="8"/><circle class="gnode" cx="62" cy="150" r="8"/><circle class="gnode" cx="116" cy="154" r="8"/>
</g>
<g class="c-edges"><line class="gedge" x1="46" y1="112" x2="92" y2="96" stroke-width="4"/><line class="gedge" x1="92" y1="96" x2="138" y2="118" stroke-width="3"/><line class="gedge" x1="46" y1="112" x2="62" y2="150" stroke-width="1.5"/><line class="gedge" x1="62" y1="150" x2="116" y2="154" stroke-width="1.5"/><line class="gedge" x1="138" y1="118" x2="116" y2="154" stroke-width="2.5"/></g>

<path class="edge c-a1" d="M180 130H204" marker-end="url(#ah-comm-dark)"/>
<g class="c-leiden"><rect class="box" x="208" y="90" width="108" height="80" rx="8"/><text class="big" x="220" y="116">Leiden</text><text class="small" x="220" y="133">graspologic</text><text class="small" x="220" y="146">clusters</text></g>
<path class="edge c-a2" d="M320 130H344" marker-end="url(#ah-comm-dark)"/>

<g class="c-comms">
<rect class="box" x="348" y="76" width="112" height="108" rx="8"/>
<circle class="blob" cx="378" cy="112" r="22"/><circle class="dot" cx="370" cy="107" r="3.5"/><circle class="dot" cx="385" cy="110" r="3.5"/><circle class="dot" cx="376" cy="120" r="3.5"/><circle class="blob" cx="428" cy="140" r="18"/><circle class="dot" cx="423" cy="137" r="3.5"/><circle class="dot" cx="434" cy="143" r="3.5"/><circle class="blob" cx="388" cy="166" r="11"/><circle class="dot" cx="384" cy="166" r="3.5"/><circle class="dot" cx="392" cy="168" r="3.5"/>
</g>
<text class="big c-comms" x="348" y="68">Communities</text>

<path class="edge c-a3" d="M464 130H488" marker-end="url(#ah-comm-dark)"/>
<g class="c-reports"><rect class="box" x="492" y="90" width="132" height="80" rx="8"/><text class="big" x="504" y="116">Reports</text><text class="small" x="504" y="133">summary, findings</text><text class="small" x="504" y="146">embedded</text></g>

<g class="c-question">
<rect class="chip" x="656" y="26" width="116" height="28" rx="14"/>
<text class="chip-name" x="714" y="45" text-anchor="middle">Broad question</text>
</g>
<path class="edge c-a4" d="M628 130H652" marker-end="url(#ah-comm-dark)"/>
<path class="edge c-a4" d="M714 58V88" marker-end="url(#ah-comm-dark)"/>
<g class="c-theme"><rect class="box" x="656" y="92" width="116" height="80" rx="8"/><text class="big" x="668" y="118">Theme search</text><text class="small" x="668" y="135">matches by</text><text class="small" x="668" y="148">meaning</text></g>
<path class="edge c-a5" d="M776 132H792" marker-end="url(#ah-comm-dark)"/>
<g class="c-passages"><rect class="focal" x="796" y="92" width="70" height="80" rx="8"/>
<text class="focal-name" x="831" y="126" text-anchor="middle">Passages</text>
<text class="focal-sub" x="831" y="144" text-anchor="middle" style="font-size:11px">behind</text>
<text class="focal-sub" x="831" y="158" text-anchor="middle" style="font-size:11px">each theme</text></g>

<text class="note" x="24" y="216">Each relation weighs the passages that state it. Detection runs when you ask, and applying it replaces the previous communities.</text>
</svg>
