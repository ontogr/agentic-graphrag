<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="resolve-light-title resolve-light-desc">
<title id="resolve-light-title">Entity resolution</title>
<desc id="resolve-light-desc">Extracted entities with the same label and text collapse into one entity. Other pairs go down tiers: a name gate, fuzzy match, embedding similarity, clustering and LLM review. A match is stored as a link between entities, and linked entities are grouped under one resolved entity.</desc>
<style>
.panel{fill:#faf8f3;stroke:#e4e0d6}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#6b655f}
.box{fill:#f3f0e9;stroke:#cbc6b9}
.box-title{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.box-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.chip{fill:#ffffff;stroke:#cbc6b9}
.chip-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.chip-tag{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8}
.node{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1.25}
.node-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.node-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.focal{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:1.25}
.focal-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}
.focal-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff;opacity:.85}
.bar{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1.25}
.edge{fill:none;stroke:#6b655f;stroke-width:1.5}
.edge-blue{fill:none;stroke:#1d4ed8;stroke-width:1.5}
.edge-dash{fill:none;stroke:#1d4ed8;stroke-width:1.5;stroke-dasharray:5 4}
.edge-soft{fill:none;stroke:#6b655f;stroke-width:1.25;stroke-dasharray:5 4}
.elabel{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f;letter-spacing:.04em}
.elabel-blue{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8;letter-spacing:.04em}
.mask{fill:#faf8f3}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#6b655f}
.arrowhead{fill:#6b655f}
.arrowhead-blue{fill:#1d4ed8}
.glyph-page{fill:#ffffff;stroke:#cbc6b9;stroke-width:1.5}
.glyph-line{fill:#cbc6b9}
.span{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1}
.span-text{font:600 10px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.badge{fill:#1d4ed8}
.badge-text{font:600 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff}
.y-chip0{animation:y-chip0 14.0s ease-out infinite}
.y-chip1{animation:y-chip1 14.0s ease-out infinite}
.y-chip2{animation:y-chip2 14.0s ease-out infinite}
.y-in{animation:y-in 14.0s ease-out infinite}
.y-tier0{animation:y-tier0 14.0s ease-out infinite}
.y-tier1{animation:y-tier1 14.0s ease-out infinite}
.y-tier2{animation:y-tier2 14.0s ease-out infinite}
.y-tier3{animation:y-tier3 14.0s ease-out infinite}
.y-tier4{animation:y-tier4 14.0s ease-out infinite}
.y-tier5{animation:y-tier5 14.0s ease-out infinite}
.y-out{animation:y-out 14.0s ease-out infinite}
.y-n1{animation:y-n1 14.0s ease-out infinite}
.y-n2{animation:y-n2 14.0s ease-out infinite}
.y-n3{animation:y-n3 14.0s ease-out infinite}
.y-m1{animation:y-m1 14.0s ease-out infinite}
.y-m2{animation:y-m2 14.0s ease-out infinite}
.y-r1{animation:y-r1 14.0s ease-out infinite}
.y-r2{animation:y-r2 14.0s ease-out infinite}
.y-r3{animation:y-r3 14.0s ease-out infinite}
.y-res{animation:y-res 14.0s ease-out infinite}
.y-note{animation:y-note 14.0s ease-out infinite}
@keyframes y-chip0{0%,2.14%{opacity:0;transform:translateX(-28px)}5.71%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-chip1{0%,5.00%{opacity:0;transform:translateX(-28px)}8.57%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-chip2{0%,7.86%{opacity:0;transform:translateX(-28px)}11.43%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-in{0%,12.86%{opacity:0}16.43%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-tier0{0%,15.71%{opacity:0;transform:translateY(10px)}19.29%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier1{0%,18.57%{opacity:0;transform:translateY(10px)}22.14%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier2{0%,21.43%{opacity:0;transform:translateY(10px)}25.00%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier3{0%,24.29%{opacity:0;transform:translateY(10px)}27.86%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier4{0%,27.14%{opacity:0;transform:translateY(10px)}30.71%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier5{0%,30.00%{opacity:0;transform:translateY(10px)}33.57%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-out{0%,34.29%{opacity:0}37.86%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-n1{0%,36.43%{opacity:0;transform:translateY(10px)}40.00%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-n2{0%,37.86%{opacity:0;transform:translateY(10px)}41.43%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-n3{0%,39.29%{opacity:0;transform:translateY(10px)}42.86%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-m1{0%,42.14%{opacity:0}45.71%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-m2{0%,43.57%{opacity:0}47.14%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-r1{0%,46.43%{opacity:0}50.00%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-r2{0%,47.14%{opacity:0}50.71%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-r3{0%,47.86%{opacity:0}51.43%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@keyframes y-res{0%,49.29%{opacity:0;transform:translateY(10px)}52.86%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-note{0%,54.29%{opacity:0}57.86%,90.00%{opacity:1;transform:none}95.71%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<marker id="ah-resolve-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahb-resolve-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead-blue" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="439" rx="10"/>

<text class="stage" x="28" y="62">ENTITIES</text>
<text class="stage" x="236" y="62">TIERS, CHEAPEST FIRST</text>
<text class="stage" x="544" y="62">LINKS, NOT MERGES</text>
<g class="y-chip0"><rect class="chip" x="28" y="96" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="115">Charles Babbage</text><text class="chip-tag" x="180" y="115" text-anchor="end">x2</text></g><g class="y-chip1"><rect class="chip" x="28" y="148" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="167">Babbage Charles</text></g><g class="y-chip2"><rect class="chip" x="28" y="200" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="219">C. Babbage</text></g>
<path class="edge y-in" d="M192 160H232" marker-end="url(#ah-resolve-light)"/>
<g class="y-tier0"><rect class="box" x="236" y="84" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="105">Exact</text><text class="box-sub" x="330" y="105">dedupe: same label and text</text></g><g class="y-tier1"><rect class="bar" x="236" y="124" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="145">Name gate</text><text class="box-sub" x="330" y="145">different numbers: never</text></g><g class="y-tier2"><rect class="box" x="236" y="164" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="185">Fuzzy</text><text class="box-sub" x="330" y="185">close spellings</text></g><g class="y-tier3"><rect class="box" x="236" y="204" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="225">Embedding</text><text class="box-sub" x="330" y="225">similar names</text></g><g class="y-tier4"><rect class="box" x="236" y="244" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="265">Cluster</text><text class="box-sub" x="330" y="265">tight groups</text></g><g class="y-tier5"><rect class="box" x="236" y="284" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="305">LLM</text><text class="box-sub" x="330" y="305">only the unclear pairs</text></g>
<path class="edge y-out" d="M524 200H540" marker-end="url(#ah-resolve-light)"/>

<path class="edge-dash y-m1" d="M603 130V156" marker-end="url(#ahb-resolve-light)"/>
<path class="edge-dash y-m2" d="M603 190V216" marker-end="url(#ahb-resolve-light)"/>
<g class="y-m1"><rect class="mask" x="611" y="136" width="54" height="14"/><text class="elabel-blue" x="615" y="147" text-anchor="start">MATCHES</text></g>

<path class="edge y-r1" d="M662 113H688Q696 113 696 121V152Q696 160 704 160H730" marker-end="url(#ah-resolve-light)"/>
<path class="edge y-r2" d="M662 173H730" marker-end="url(#ah-resolve-light)"/>
<path class="edge y-r3" d="M662 233H688Q696 233 696 225V194Q696 186 704 186H730" marker-end="url(#ah-resolve-light)"/>
<g class="y-r2"><rect class="mask" x="708" y="131" width="70" height="14"/><text class="elabel" x="712" y="142" text-anchor="start">RESOLVED_AS</text></g>

<g class="y-n1"><rect class="node" x="544" y="96" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="111" text-anchor="middle">Charles Babbage</text><text class="node-sub" x="603.0" y="123" text-anchor="middle">entity</text></g>
<g class="y-n2"><rect class="node" x="544" y="156" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="171" text-anchor="middle">Babbage Charles</text><text class="node-sub" x="603.0" y="183" text-anchor="middle">entity</text></g>
<g class="y-n3"><rect class="node" x="544" y="216" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="231" text-anchor="middle">C. Babbage</text><text class="node-sub" x="603.0" y="243" text-anchor="middle">entity</text></g>
<g class="y-res"><rect class="focal" x="730" y="156" width="120" height="34" rx="6"/><text class="focal-name" x="790.0" y="171" text-anchor="middle">Charles Babbage</text><text class="focal-sub" x="790.0" y="183" text-anchor="middle">ResolvedEntity</text></g>

<g class="y-note">
<text class="note" x="544" y="288">A pair that no tier can decide stays</text>
<text class="note" x="544" y="305">undecided. It is never a rejection.</text>
</g>
<text class="note" x="28" y="408">Exact duplicates collapse into one entity as they are ingested. Near duplicates stay separate</text>
<text class="note" x="28" y="425">and are joined by links, so every match can be undone or re-checked later.</text>
</svg>
