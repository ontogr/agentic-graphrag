<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 568" width="880" height="568" role="img" aria-labelledby="trace-light-title trace-light-desc">
<title id="trace-light-title">A trace of one add call</title>
<desc id="trace-light-desc">A waterfall of the spans that one add call records for one chunk with the local extractor. The add span holds chunk document, extract chunk with the GLiNER extraction, and the cutover job. The cutover job holds ingest chunks, which holds resolution, merge group and storage writes, and then rebuild components. The GLiNER span is selected and shows its entity and relation counts.</desc>
<style>
.panel{fill:#faf8f3;stroke:#e4e0d6}
.kicker{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#6b655f}
.root{font:600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.pill{fill:#f3f0e9;stroke:#cbc6b9}
.pill-text{font:11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.tick{font:10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.grid{stroke:#e4e0d6;stroke-width:1}
.zebra{fill:#f3f0e9;opacity:.55}
.name{font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.chev{fill:none;stroke:#6b655f;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.guide{fill:none;stroke:#cbc6b9;stroke-width:1}
.sel{fill:none;stroke:#1d4ed8;stroke-width:1.5}
.legend{font:11.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#6b655f}
.detail{fill:#ffffff;stroke:#cbc6b9}
.d-title{font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.d-label{font:11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.d-key{font:11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.d-val{font:600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8}
.badge{fill:#eaf0fe;stroke:#1d4ed8}
.badge-text{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8}
</style>
