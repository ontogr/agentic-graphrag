<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="resolve-dark-title resolve-dark-desc">
<title id="resolve-dark-title">Entity resolution</title>
<desc id="resolve-dark-desc">Extracted entities with the same label and text collapse into one entity. Other pairs go down tiers: a name gate, fuzzy match, embedding similarity, clustering and LLM review. A match is stored as a link between entities, and linked entities are grouped under one resolved entity.</desc>
<style>
.panel{fill:#17181c;stroke:#2a2d33}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#a8a29e}
.box{fill:#24262b;stroke:#3b3f46}
.box-title{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.box-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e}
.chip{fill:#1e2025;stroke:#3b3f46}
.chip-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.chip-tag{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7aa7ff}
.node{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25}
.node-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.node-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e}
.focal{fill:#7aa7ff;stroke:#7aa7ff;stroke-width:1.25}
.focal-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#111827}
.focal-sub{font:9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#111827;opacity:.85}
.bar{fill:#1b2438;stroke:#7aa7ff;stroke-width:1.25}
.edge{fill:none;stroke:#a8a29e;stroke-width:1.5}
.edge-blue{fill:none;stroke:#7aa7ff;stroke-width:1.5}
.edge-dash{fill:none;stroke:#7aa7ff;stroke-width:1.5;stroke-dasharray:5 4}
.edge-soft{fill:none;stroke:#a8a29e;stroke-width:1.25;stroke-dasharray:5 4}
.elabel{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#a8a29e;letter-spacing:.04em}
.elabel-blue{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7aa7ff;letter-spacing:.04em}
.mask{fill:#17181c}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#a8a29e}
.arrowhead{fill:#a8a29e}
.arrowhead-blue{fill:#7aa7ff}
.glyph-page{fill:#1e2025;stroke:#3b3f46;stroke-width:1.5}
.glyph-line{fill:#3b3f46}
.span{fill:#1b2438;stroke:#7aa7ff;stroke-width:1}
.span-text{font:600 10px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#e5e7eb}
.badge{fill:#7aa7ff}
.badge-text{font:600 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#111827}
.y-chip0{animation:y-chip0 26.0s ease-out infinite}
.y-chip1{animation:y-chip1 26.0s ease-out infinite}
.y-chip2{animation:y-chip2 26.0s ease-out infinite}
.y-in{animation:y-in 26.0s ease-out infinite}
.y-tier0{animation:y-tier0 26.0s ease-out infinite}
.y-tier1{animation:y-tier1 26.0s ease-out infinite}
.y-tier2{animation:y-tier2 26.0s ease-out infinite}
.y-tier3{animation:y-tier3 26.0s ease-out infinite}
.y-tier4{animation:y-tier4 26.0s ease-out infinite}
.y-tier5{animation:y-tier5 26.0s ease-out infinite}
.y-out{animation:y-out 26.0s ease-out infinite}
.y-n1{animation:y-n1 26.0s ease-out infinite}
.y-n2{animation:y-n2 26.0s ease-out infinite}
.y-n3{animation:y-n3 26.0s ease-out infinite}
.y-m1{animation:y-m1 26.0s ease-out infinite}
.y-m2{animation:y-m2 26.0s ease-out infinite}
.y-r1{animation:y-r1 26.0s ease-out infinite}
.y-r2{animation:y-r2 26.0s ease-out infinite}
.y-r3{animation:y-r3 26.0s ease-out infinite}
.y-res{animation:y-res 26.0s ease-out infinite}
.y-note{animation:y-note 26.0s ease-out infinite}
@keyframes y-chip0{0%,1.15%{opacity:0;transform:translateX(-28px)}3.08%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-chip1{0%,2.69%{opacity:0;transform:translateX(-28px)}4.62%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-chip2{0%,4.23%{opacity:0;transform:translateX(-28px)}6.15%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes y-in{0%,6.92%{opacity:0}8.85%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-tier0{0%,8.46%{opacity:0;transform:translateY(10px)}10.38%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier1{0%,10.00%{opacity:0;transform:translateY(10px)}11.92%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier2{0%,11.54%{opacity:0;transform:translateY(10px)}13.46%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier3{0%,13.08%{opacity:0;transform:translateY(10px)}15.00%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier4{0%,14.62%{opacity:0;transform:translateY(10px)}16.54%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-tier5{0%,16.15%{opacity:0;transform:translateY(10px)}18.08%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-out{0%,18.46%{opacity:0}20.38%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-n1{0%,19.62%{opacity:0;transform:translateY(10px)}21.54%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-n2{0%,20.38%{opacity:0;transform:translateY(10px)}22.31%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-n3{0%,21.15%{opacity:0;transform:translateY(10px)}23.08%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-m1{0%,22.69%{opacity:0}24.62%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-m2{0%,23.46%{opacity:0}25.38%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-r1{0%,25.00%{opacity:0}26.92%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-r2{0%,25.38%{opacity:0}27.31%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-r3{0%,25.77%{opacity:0}27.69%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@keyframes y-res{0%,26.54%{opacity:0;transform:translateY(10px)}28.46%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0;transform:translateY(10px)}}
@keyframes y-note{0%,29.23%{opacity:0}31.15%,95.38%{opacity:1;transform:none}99.23%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<marker id="ah-resolve-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker>
<marker id="ahb-resolve-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead-blue" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="439" rx="10"/>

<text class="stage" x="28" y="62">ENTITIES</text>
<text class="stage" x="236" y="62">TIERS, CHEAPEST FIRST</text>
<text class="stage" x="544" y="62">LINKS, NOT MERGES</text>
<g class="y-chip0"><rect class="chip" x="28" y="96" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="115">Charles Babbage</text><text class="chip-tag" x="180" y="115" text-anchor="end">x2</text></g><g class="y-chip1"><rect class="chip" x="28" y="148" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="167">Babbage Charles</text></g><g class="y-chip2"><rect class="chip" x="28" y="200" width="160" height="30" rx="5"/><text class="chip-name" x="40" y="219">C. Babbage</text></g>
<path class="edge y-in" d="M192 160H232" marker-end="url(#ah-resolve-dark)"/>
<g class="y-tier0"><rect class="box" x="236" y="84" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="105">Exact</text><text class="box-sub" x="330" y="105">dedupe: same label and text</text></g><g class="y-tier1"><rect class="bar" x="236" y="124" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="145">Name gate</text><text class="box-sub" x="330" y="145">different numbers: never</text></g><g class="y-tier2"><rect class="box" x="236" y="164" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="185">Fuzzy</text><text class="box-sub" x="330" y="185">close spellings</text></g><g class="y-tier3"><rect class="box" x="236" y="204" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="225">Embedding</text><text class="box-sub" x="330" y="225">similar names</text></g><g class="y-tier4"><rect class="box" x="236" y="244" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="265">Cluster</text><text class="box-sub" x="330" y="265">tight groups</text></g><g class="y-tier5"><rect class="box" x="236" y="284" width="284" height="34" rx="6"/><text class="chip-name" x="248" y="305">LLM</text><text class="box-sub" x="330" y="305">only the unclear pairs</text></g>
<path class="edge y-out" d="M524 200H540" marker-end="url(#ah-resolve-dark)"/>

<path class="edge-dash y-m1" d="M603 130V156" marker-end="url(#ahb-resolve-dark)"/>
<path class="edge-dash y-m2" d="M603 190V216" marker-end="url(#ahb-resolve-dark)"/>
<g class="y-m1"><rect class="mask" x="611" y="136" width="54" height="14"/><text class="elabel-blue" x="615" y="147" text-anchor="start">MATCHES</text></g>

<path class="edge y-r1" d="M662 113H688Q696 113 696 121V152Q696 160 704 160H730" marker-end="url(#ah-resolve-dark)"/>
<path class="edge y-r2" d="M662 173H730" marker-end="url(#ah-resolve-dark)"/>
<path class="edge y-r3" d="M662 233H688Q696 233 696 225V194Q696 186 704 186H730" marker-end="url(#ah-resolve-dark)"/>
<g class="y-r2"><rect class="mask" x="708" y="131" width="70" height="14"/><text class="elabel" x="712" y="142" text-anchor="start">RESOLVED_AS</text></g>

<g class="y-n1"><rect class="node" x="544" y="96" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="111" text-anchor="middle">Charles Babbage</text><text class="node-sub" x="603.0" y="123" text-anchor="middle">entity</text></g>
<g class="y-n2"><rect class="node" x="544" y="156" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="171" text-anchor="middle">Babbage Charles</text><text class="node-sub" x="603.0" y="183" text-anchor="middle">entity</text></g>
<g class="y-n3"><rect class="node" x="544" y="216" width="118" height="34" rx="6"/><text class="node-name" x="603.0" y="231" text-anchor="middle">C. Babbage</text><text class="node-sub" x="603.0" y="243" text-anchor="middle">entity</text></g>
<g class="y-res"><rect class="focal" x="730" y="156" width="120" height="34" rx="6"/><text class="focal-name" x="790.0" y="171" text-anchor="middle">Charles Babbage</text><text class="focal-sub" x="790.0" y="183" text-anchor="middle">ResolvedEntity</text></g>

<g class="y-note">
<text class="note" x="544" y="288">A pair that no tier can decide stays</text>
<text class="note" x="544" y="305">undecided. It is never a rejection.</text>
</g>
<text class="note" x="28" y="408">Exact duplicates collapse into one entity as they are ingested. Near duplicates stay separate</text>
<text class="note" x="28" y="425">and are joined by links, so every match can be undone or re-checked later.</text>
</svg>
