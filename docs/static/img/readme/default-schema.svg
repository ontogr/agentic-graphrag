<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="schema-graph-light-title schema-graph-light-desc">
<title id="schema-graph-light-title">The default schema</title>
<desc id="schema-graph-light-desc">Nine entity types and the eight relations that join them. A person works for an organization. A person or organization authors, owns and takes part in other types. Software depends on software or a dataset, and organizations supply products. An organization, event or project is located in a location. Four types can be part of their own kind.</desc>
<style>
.panel{fill:#faf8f3;stroke:#e4e0d6}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#6b655f}
.group{fill:none;stroke:#cbc6b9;stroke-width:1.25;stroke-dasharray:6 4}
.group-title{font:600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.group-note{font:11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#6b655f}
.node{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1.5}
.node-name{font:600 13.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.edge{fill:none;stroke:#6b655f;stroke-width:1.5}
.lab{font:11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.mask{fill:#faf8f3}
.ah{fill:#6b655f}
</style>
