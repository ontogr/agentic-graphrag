<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" role="img" aria-labelledby="qo-title qo-desc">
<title id="qo-title">Output of the quickstart script</title>
<desc id="qo-desc">A terminal after python example.py runs on a sample document. The answer has three numbered points, and every reference is [1] because all cited passages come from one document. A Sources list ends the output with one entry, the document title.</desc>
<rect x="0.5" y="0.5" width="879" height="415" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 10.5 a10 10 0 0 1 10 -10 H869.5 a10 10 0 0 1 10 10 V36 H0.5 Z" fill="#161b22"/>
<line x1="0.5" y1="36" x2="879.5" y2="36" stroke="#30363d"/>
<circle cx="22" cy="19" r="5.5" fill="#484f58"/><circle cx="42" cy="19" r="5.5" fill="#484f58"/><circle cx="62" cy="19" r="5.5" fill="#484f58"/>
<text x="440.0" y="23" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">example.py</text>
<text x="24" y="66" fill="#8b949e" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ python example.py</text><text x="24" y="108" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">The "Acme Robotics engineering notes" document covers three main points:</text><text x="24" y="150" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">1.  **Route Planning**: Maria Chen developed the Orion Planner, which schedules delivery</text><text x="24" y="171" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    routes for warehouse robots in Berlin and can replan routes within two seconds if an</text><text x="24" y="192" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    aisle is blocked <tspan fill="#79c0ff" font-weight="600">[1]</tspan>.</text><text x="24" y="213" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">2.  **Dependencies**: The Orion Planner relies on Orion Maps, a map service maintained by</text><text x="24" y="234" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    Daniel Okafor, which provides the floor plans necessary to locate free aisles <tspan fill="#79c0ff" font-weight="600">[1]</tspan>.</text><text x="24" y="255" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">3.  **Data Retention**: Robot logs are deleted after 30 days <tspan fill="#79c0ff" font-weight="600">[1]</tspan>. Additionally, customer</text><text x="24" y="276" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    delivery data is deleted within 10 business days following a verified erasure</text><text x="24" y="297" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">    request <tspan fill="#79c0ff" font-weight="600">[1]</tspan>.</text><text x="24" y="339" fill="#e6edf3" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">### Sources</text><text x="24" y="381" fill="#c9d1d9" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="600">[1]</tspan> Acme Robotics engineering notes</text>
</svg>
