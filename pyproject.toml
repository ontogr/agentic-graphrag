[build-system]
requires = ["uv_build>=0.11.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "agentic-graphrag"
version = "0.0.1"
description = "Agentic GraphRAG: graph-based retrieval-augmented generation with agentic reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["graphrag", "rag", "knowledge-graph", "agents", "retrieval"]
authors = [
  { name = "Ashwin Mathur", email = "ashwinm400@gmail.com" },
  { name = "Varun Mathur", email = "varunm500@gmail.com" },
]
maintainers = [
  { name = "Ashwin Mathur", email = "ashwinm400@gmail.com" },
  { name = "Varun Mathur", email = "varunm500@gmail.com" },
]
classifiers = [
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "chonkie>=1.7",            # bare install, no chonkie extras
  "opentelemetry-api>=1.20", # API only; the SDK stays optional
  "charset-normalizer>=3.4",
  "markdown-it-py>=3.0",
  "selectolax>=0.3.21",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
observability = [
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp>=1.20",
  "opentelemetry-instrumentation-asyncio",
  "openinference-semantic-conventions",
]
llm = [
    "baml-py>=0.226.1",
]
extract = [
    "gliner2[local]",
    "transformers<4.56",
    "protobuf",
]

[project.urls]
Documentation = "https://ontogr.github.io/agentic-graphrag/"
Issues = "https://github.com/ontogr/agentic-graphrag/issues"
Source = "https://github.com/ontogr/agentic-graphrag"

[tool.uv.build-backend]
module-root = ""
module-name = "agrag"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "bandit>=1.9.3",
  "coverage[toml]>=7.13.0",
  "pip-audit>=2.10.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-rerunfailures>=16.2",
  "pytest-socket>=0.7.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.14.14",
  "ty>=0.0.32",
  "typos>=1.42.3",
]
docs = [
  "griffe2md>=1.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "pyproject.toml", "*.ipynb"]
extend-exclude = ["thoughts", "agrag/llm/baml_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "COM", # flake8-commas
  "C4",  # flake8-comprehensions
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "ICN", # flake8-import-conventions
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle
  "N",   # pep8-naming
  "ERA", # eradicate
  "PL",  # pylint
]
ignore = [
  "PLR2004", # Replace magic number with named constant
  "COM812",  # Trailing comma missing (conflicts with the formatter)
  "PLR0913", # Too many arguments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"tests/**/*.py" = ["N802", "N999"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
known-first-party = ["agrag"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/unit"]
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket -q -ra -n auto --dist loadscope"
markers = [
  "integration: Integration test that requires external services (databases, APIs)",
  "slow: Slow running tests",
  "enable_socket: Allow socket connections (auto-applied to integration tests)",
  "flaky: Re-run flaky tests up to N times",
]
log_cli = false
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["agrag"]
omit = ["tests/*", "*/__init__.py"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.ty.environment]
root = [".", "tests"]

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

# The BAML codegen output is generated, never hand-edited; silence the few
# diagnostics ty reports inside it.
[[tool.ty.overrides]]
include = ["agrag/llm/baml_client/**"]
[tool.ty.overrides.rules]
too-many-positional-arguments = "ignore"
unresolved-attribute = "ignore"
unused-type-ignore-comment = "ignore"

[tool.bandit]
exclude_dirs = ["/tests", "/.venv", "/build", "/dist"]
skips = ["B101"]

[tool.griffe2md]
docstring_style = "google"
show_signature_annotations = true
signature_crossrefs = true

[tool.typos.files]
# Fixtures under tests/**/fixtures/ hold deliberately non-UTF-8 bytes (latin-1,
# UTF-16 with BOM) and intentional odd words that exercise decode edge cases.
# thoughts/ holds vendored reference repos and research notes, not this project's
# own prose (see the matching [tool.ruff] extend-exclude).
extend-exclude = ["tests/**/fixtures/**", "thoughts/**", "agrag/llm/baml_client/**"]
