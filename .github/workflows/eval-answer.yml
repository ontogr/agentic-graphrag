name: Eval answer quality

# The answer quality gate runs the real agent and the judge, so it does not run
# on pull requests. It runs after a merge that changes the agent, retrieval,
# ingestion or eval code, and once a week. It posts to Discord when it fails.
# The shared job steps live in the shared workflow.

on:
  push:
    branches: [main]
    paths:
      - "agrag/agents/**"
      - "agrag/chunking/**"
      - "agrag/common/**"
      - "agrag/cypher/**"
      - "agrag/embedding/**"
      - "agrag/retrieval/**"
      - "agrag/ingestion/**"
      - "agrag/graphdb/**"
      - "agrag/llm/**"
      - "agrag/loaders/**"
      - "agrag/vectordb/**"
      - "agrag/eval/answer.py"
      - "agrag/eval/judge.py"
      - "agrag/eval/repeat.py"
      - "agrag/eval/settings.py"
      - "tests/fixtures/eval/answer_quality/**"
      - "tests/integration/eval/**"
      - "docker/docker-compose.ci.yml"
      - "Makefile"
      - ".github/workflows/eval-answer.yml"
      - ".github/workflows/eval-shared.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval-answer:
    name: Eval answer quality
    uses: ./.github/workflows/eval-shared.yml
    secrets: inherit
    with:
      eval_name: answer
      eval_label: Eval answer quality
      make_target: test-eval-answer
      report_paths: |
        reports/eval/answer_quality.json
        pytest-eval-answer-results.xml
      timeout_minutes: 30
      needs_services: true
      with_judge: true
