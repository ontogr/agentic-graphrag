name: CI

on:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Run lint checks
        run: make lint-check
      - name: Typos check
        run: make lint-typos
      - name: Audit workflows
        run: make lint-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Run type check
        run: make lint-typing

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: make sync
      - name: Run tests with coverage
        run: make test
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-agrag
          fail_ci_if_error: false
          slug: ontogr/agentic-graphrag
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 30

  docs:
    name: docs-api up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    outputs:
      stale: ${{ steps.docs-check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - run: uv run python .github/scripts/update_precommit_docs_pins.py --check
      - run: make docs-api
      - name: Check for docs staleness
        id: docs-check
        run: |
          if git diff --exit-code HEAD -- docs/docs/api/index.md > /dev/null; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
          git diff HEAD -- docs/docs/api/index.md | head -c 6500 > /tmp/docs.diff || true
          cat /tmp/docs.diff || true
      - name: Fail on stale docs
        if: steps.docs-check.outputs.stale == 'true'
        run: |
          echo "::error::docs/docs/api/index.md is stale. Run 'make docs-api' locally and commit."
          exit 1
  docs-comment:
    name: docs-api comment
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment docs status
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-api
          hide_details: true
          message: |
            ${{ needs.docs.outputs.stale == 'true' && '**API Documentation is stale**. Run `make docs-api` locally to update the docs and commit.' || (needs.docs.result == 'success' && '**API Documentation is up to date**.' || '**The docs-api check did not complete**. Read the `docs-api up to date` job logs for the failure.') }}

  wheel:
    name: Test Packaging - wheel build & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheelenv"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl
      - name: Import from outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheelenv/bin/python" -c "import agrag; print(agrag.__version__)"
      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Run Bandit security scan
        run: make security-bandit
        continue-on-error: true
      - name: Generate Bandit JSON report
        if: always()
        run: uv run bandit -c pyproject.toml -r agrag/ -f json -o bandit-report.json || true
      - name: Run pip-audit
        run: make security-audit
        continue-on-error: true
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
