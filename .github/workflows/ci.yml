name: CI

on:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  changes:
    name: Select checks
    uses: $/.github/workflows/changes.yml

  lint:
    name: Lint & Format Check
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Require successful change selection
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTOR_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.changes.outputs.python_lint == 'true' || needs.changes.outputs.workflow_audit == 'true' || needs.changes.outputs.typos == 'true'
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.python_lint == 'true' || needs.changes.outputs.workflow_audit == 'true' || needs.changes.outputs.typos == 'true'
        with:
          python-version: "3.12"
      - run: make sync
        if: needs.changes.outputs.python_lint == 'true' || needs.changes.outputs.workflow_audit == 'true'
      - name: Run lint checks
        if: needs.changes.outputs.python_lint == 'true'
        run: make lint-check
      - name: Typos check
        if: needs.changes.outputs.typos == 'true'
        run: |
          typos_version=$(uv run --no-project python -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("uv.lock", "rb"))["package"] if package["name"] == "typos"))')
          uvx --from "typos==${typos_version}" typos
      - name: Audit workflows
        if: needs.changes.outputs.workflow_audit == 'true'
        run: make lint-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  script-tests:
    name: CI selector tests
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv run --no-project python .github/scripts/ci_changes.py --self-test

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks for untrusted changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --verbose
      - name: Run Gitleaks
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  type-check:
    name: Type Checking
    needs: [changes]
    if: needs.changes.outputs.typing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - name: Run type check
        run: make lint-typing

  test:
    name: Tests - Python ${{ matrix.python-version }}
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: make sync
      - name: Run tests with coverage
        run: make test
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-agrag
          fail_ci_if_error: false
          slug: ontogr/agentic-graphrag
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 30

  docs:
    name: docs-api up to date
    needs: [changes]
    if: needs.changes.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    outputs:
      stale: ${{ steps.docs-check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - run: make docs-api
        if: needs.changes.outputs.api_docs == 'true'
      - name: Check for docs staleness
        id: docs-check
        if: needs.changes.outputs.api_docs == 'true'
        run: |
          git add -N docs/docs/api
          if git diff --quiet HEAD -- docs/docs/api; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
          git diff HEAD -- docs/docs/api | head -c 6500 > /tmp/docs.diff || true
          cat /tmp/docs.diff || true
      - name: Fail on stale docs
        if: needs.changes.outputs.api_docs == 'true' && steps.docs-check.outputs.stale == 'true'
        run: |
          echo "::error::The pages in docs/docs/api are stale. Run 'make docs-api' locally and commit."
          exit 1
  docs-pins:
    name: Documentation dependency pins
    needs: [changes]
    if: needs.changes.outputs.docs_pins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - run: uv run python .github/scripts/update_precommit_docs_pins.py --check

  docs-site:
    name: Build documentation site
    needs: [changes]
    if: needs.changes.outputs.docs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: make docs-install
      - run: make docs-build

  docs-comment:
    name: docs-api comment
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.api_docs == 'true'
    needs: [changes, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment docs status
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-api
          hide_details: true
          message: |
            ${{ needs.docs.outputs.stale == 'true' && '**API Documentation is stale**. Run `make docs-api` locally to update the docs and commit.' || (needs.docs.result == 'success' && '**API Documentation is up to date**.' || '**The docs-api check did not complete**. Read the `docs-api up to date` job logs for the failure.') }}

  wheel:
    name: Test Packaging - wheel build & install
    needs: [changes]
    if: needs.changes.outputs.wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheelenv"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl
      - name: Import from outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheelenv/bin/python" -c "import agrag; print(agrag.__version__)"
      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*

  security:
    name: Python Security Scanning
    needs: [changes]
    if: needs.changes.outputs.bandit == 'true' || needs.changes.outputs.dependency_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.bandit == 'true' || needs.changes.outputs.dependency_audit == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.changes.outputs.bandit == 'true' || needs.changes.outputs.dependency_audit == 'true'
        with:
          enable-cache: false
      - run: make sync
        if: needs.changes.outputs.bandit == 'true' || needs.changes.outputs.dependency_audit == 'true'
      - name: Run Bandit security scan
        if: needs.changes.outputs.bandit == 'true'
        run: make security-bandit
        continue-on-error: true
      - name: Generate Bandit JSON report
        if: always() && needs.changes.outputs.bandit == 'true'
        run: uv run bandit -c pyproject.toml -r agrag/ -f json -o bandit-report.json || true
      # uv audit reads uv.lock and matches advisories by package name and
      # version, so it also covers the +cpu builds of torch and torchvision.
      - name: Run uv audit
        if: needs.changes.outputs.dependency_audit == 'true'
        run: make security-audit
        continue-on-error: true
      - name: Upload Bandit results
        if: always() && needs.changes.outputs.bandit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
