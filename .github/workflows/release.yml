name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  release-on-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build distributions
        run: |
          uv build
          uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*

      - name: Verify the wheel imports from a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheelenv"
          uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheelenv/bin/python" -c "import agrag; print(agrag.__version__)"

      - name: Publish on PyPI
        run: uv publish --trusted-publishing always
