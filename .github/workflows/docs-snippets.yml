name: Docs snippets

# Runs every Python block in the docs. Blocks that need an LLM run only on pushes
# to main, the weekly schedule, and manual runs. Pull requests never receive the
# LLM secrets, so those blocks skip there.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  changes:
    uses: $/.github/workflows/changes.yml

  snippets:
    name: Docs code blocks (shard ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.snippets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The Makefile assigns pages to shards. Each shard has its own Neo4j.
        shard: [1, 2, 3]
    env:
      DOCS_SHARD: ${{ matrix.shard }}
      # Print the slowest blocks, so the Makefile shard lists can be rebalanced.
      PYTEST_ADDOPTS: --durations=10
      UV_PYTHON: "3.12"
      # Fixed, throwaway credentials scoped to this job's own Docker network.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
      BAML_LOG: "off"
      # This job owns its Neo4j service, so the docs fixtures can empty it.
      DOCS_TEST_ALLOW_NEO4J_RESET: "1"
      # Empty on pull requests, so blocks that need an LLM skip there.
      LLM_BASE_URL: ${{ github.event_name != 'pull_request' && secrets.LLM_BASE_URL || '' }}
      LLM_API_KEY: ${{ github.event_name != 'pull_request' && secrets.LLM_API_KEY || '' }}
      LLM_MODEL_ID: ${{ github.event_name != 'pull_request' && secrets.LLM_MODEL_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Started without --wait so the image pull overlaps with the setup below.
      - name: Start Neo4j
        run: docker compose -f docker/docker-compose.ci.yml up -d neo4j

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Wait for Neo4j
        run: docker compose -f docker/docker-compose.ci.yml up -d --wait --wait-timeout 420 neo4j

      - name: Run docs code blocks
        run: |
          # Blocks that need an LLM must skip on pull requests, so the variables are removed
          # rather than left as empty strings.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            unset LLM_BASE_URL LLM_API_KEY LLM_MODEL_ID
          fi
          make docs-test

      - name: Collect service logs
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs neo4j

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v

  # One status for all shards. It runs after failures because GitHub counts a
  # skipped job as passing. It does not run for a cancelled workflow.
  result:
    name: Run docs code blocks
    needs: [changes, snippets]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SELECTOR_RESULT: ${{ needs.changes.result }}
      SELECTED: ${{ needs.changes.outputs.snippets }}
      SHARDS_RESULT: ${{ needs.snippets.result }}
    steps:
      - name: Require every shard to pass
        run: |
          test "$SELECTOR_RESULT" = success
          echo "Selected: $SELECTED; shards: $SHARDS_RESULT"
          if [ "$SELECTED" = true ]; then
            test "$SHARDS_RESULT" = success
          elif [ "$SELECTED" = false ]; then
            test "$SHARDS_RESULT" = skipped
          else
            echo "::error::Snippet selection output is missing or invalid"
            exit 1
          fi
