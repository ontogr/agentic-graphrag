name: Eval extraction

# The extraction quality gate makes one LLM call per gold sentence, so it does
# not run on pull requests. It runs after a merge that changes extraction code
# and once a week, and it posts to Discord when it fails. The shared job steps
# live in the shared workflow.

on:
  push:
    branches: [main]
    paths:
      - "agrag/ingestion/extract.py"
      - "agrag/llm/**"
      - "agrag/eval/extraction.py"
      - "agrag/eval/adapter.py"
      - "agrag/common/data_models/extraction.py"
      - "agrag/common/data_models/graph_schema.py"
      - "tests/fixtures/eval/extraction/**"
      - "tests/integration/eval/test_extraction_quality_e2e.py"
      - ".github/workflows/eval-extraction.yml"
      - ".github/workflows/eval-shared.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval-extraction:
    name: Eval extraction
    uses: ./.github/workflows/eval-shared.yml
    secrets: inherit
    with:
      eval_name: extraction
      eval_label: Eval extraction
      make_target: test-eval-extraction
      report_paths: |
        reports/eval/extraction_quality.json
        pytest-eval-extraction-results.xml
      timeout_minutes: 15
