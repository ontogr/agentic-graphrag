name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  # LLM endpoint for the agent/ingestion tests that talk to a real model.
  # Same secrets the former standalone llm-integration job used; set at the
  # workflow level so every job that runs LLM-backed tests sees them, and
  # unset (empty) on fork PRs so those tests simply skip.
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}

jobs:
  integration:
    name: Integration Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Module groups run as separate jobs, each on its own runner and own
        # ephemeral backend stack, so the integration suite's wall time is the
        # slowest group instead of the whole suite. Grouped by test count to
        # balance load; every group still starts the full Compose stack because
        # the Loaders/Embedding tests can talk to any of the backends and the
        # cost of an idle container is lower than a per-group Compose split.
        # The agents-ingestion-embedding group also runs the LLM-backed agent
        # and ingestion tests, fed by the workflow-level LLM_* secrets.
        # dist picks the xdist scheduler per suite. loadgroup is only needed by
        # retrieval-graphdb: its cypher and retrieval community tests write and
        # delete Community nodes against the same shared label and are tagged
        # xdist_group(name="community_label") to force them onto one worker.
        # Every other suite keeps the default loadscope, which groups a test
        # class's own methods onto one worker -- ingestion's community
        # detection tests rely on that (detect_communities scans the whole
        # entity graph, so its own test methods cannot run concurrently with
        # each other either), and loadgroup would ungroup them since they
        # carry no xdist_group marker.
        suite:
          - name: retrieval-graphdb
            paths: "tests/integration/retrieval tests/integration/graphdb tests/integration/cypher"
            dist: loadgroup
          - name: agents-ingestion-embedding
            paths: "tests/integration/agents tests/integration/ingestion tests/integration/embedding"
            dist: loadscope
          - name: vectordb-loaders
            paths: "tests/integration/vectordb tests/integration/loaders"
            dist: loadscope
    env:
      UV_PYTHON: "3.12"
      # Backend credentials below are fixed, throwaway values scoped to this ephemeral job's
      # own Docker network — not secrets, and not reused anywhere outside this workflow run.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ci-test-qdrant-key
      WEAVIATE_URL: http://localhost:8080
      WEAVIATE_API_KEY: ci-test-weaviate-key
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_MODE: custom
      MILVUS_URI: http://localhost:19530
      MILVUS_TOKEN: ""
      COVERAGE_FILE: coverage-data-${{ matrix.suite.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Started without --wait so image pulls/service boot overlap with the uv/Python setup and
      # `make sync` steps below, instead of serializing after them.
      - name: Start backend services (Neo4j, Qdrant, Weaviate, Milvus)
        run: docker compose -f docker/docker-compose.ci.yml up -d

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Wait for backend services to be healthy
        run: make dev-services-up

      - name: Run integration tests (${{ matrix.suite.name }})
        run: >-
          uv run pytest ${{ matrix.suite.paths }}
          -v
          -n auto --dist ${{ matrix.suite.dist }}
          -o "addopts=--strict-markers --strict-config --disable-socket --allow-unix-socket -ra"
          --cov=agrag --cov-context=test
          --junitxml=pytest-integration-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ matrix.suite.name }}
          path: |
            pytest-integration-results.xml
            coverage-data-${{ matrix.suite.name }}
          retention-days: 30

      - name: Collect backend service logs
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop backend services
        if: always()
        run: make dev-services-down

  e2e:
    name: End-to-End Pipeline Test
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
      COVERAGE_FILE: coverage-data-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start Neo4j
        run: docker compose -f docker/docker-compose.ci.yml up -d neo4j --wait --wait-timeout 420

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Run end-to-end pipeline test
        run: make test-e2e COV_ARGS="--cov=agrag --cov-context=test"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            pytest-e2e-results.xml
            coverage-data-e2e
            reports/e2e
          retention-days: 30

      - name: Stop Neo4j
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v
