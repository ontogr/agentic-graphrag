name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.12"
      # Backend credentials below are fixed, throwaway values scoped to this ephemeral job's
      # own Docker network — not secrets, and not reused anywhere outside this workflow run.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ci-test-qdrant-key
      WEAVIATE_URL: http://localhost:8080
      WEAVIATE_API_KEY: ci-test-weaviate-key
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_MODE: custom
      MILVUS_URI: http://localhost:19530
      MILVUS_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Started without --wait so image pulls/service boot overlap with the uv/Python setup and
      # `make sync` steps below, instead of serializing after them.
      - name: Start backend services (Neo4j, Qdrant, Weaviate, Milvus)
        run: docker compose -f docker/docker-compose.ci.yml up -d

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Wait for backend services to be healthy
        run: make dev-services-up

      - name: Run integration tests
        run: make test-integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: pytest-integration-results.xml
          retention-days: 30

      - name: Collect backend service logs
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop backend services
        if: always()
        run: make dev-services-down

  e2e:
    name: End-to-End Pipeline Test
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start Neo4j
        run: docker compose -f docker/docker-compose.ci.yml up -d neo4j --wait --wait-timeout 420

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Run end-to-end pipeline test
        run: make test-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: pytest-e2e-results.xml
          retention-days: 30

      - name: Stop Neo4j
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v

  llm-integration:
    name: LLM Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies with LLM and extract extras
        run: uv sync --extra llm --extra extract

      - name: Run LLM integration tests
        run: >-
          uv run pytest tests/integration/ingestion/
          -v
          --junitxml=pytest-llm-integration-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-integration-test-results
          path: pytest-llm-integration-results.xml
          retention-days: 30
