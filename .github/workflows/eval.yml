name: Eval

on:
  pull_request:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  # The agent and the judge use the existing LLM secrets. Both are empty on
  # fork PRs, so the eval tests skip there. Set EVAL_JUDGE_* to grade with a
  # model other than the agent's own.
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
  EVAL_JUDGE_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  EVAL_JUDGE_API_KEY: ${{ secrets.LLM_API_KEY }}
  EVAL_JUDGE_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}

jobs:
  eval:
    name: Eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      # Fixed, throwaway credentials scoped to this job's own Docker network.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Started without --wait so the image pull overlaps with the uv and
      # Python setup below.
      - name: Start backend services
        run: docker compose -f docker/docker-compose.ci.yml up -d neo4j

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Wait for backend services to be healthy
        run: docker compose -f docker/docker-compose.ci.yml up -d --wait --wait-timeout 420 neo4j

      - name: Run eval tests
        run: make test-eval

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-test-results
          path: pytest-eval-results.xml
          retention-days: 30

      - name: Collect backend service logs
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop backend services
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v
