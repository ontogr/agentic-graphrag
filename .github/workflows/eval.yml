name: Eval

# The harness smoke test runs the real agent and the judge, so it does not run
# on pull requests. It runs after a merge that changes the agent, the retrieval
# code or the eval harness, and once a week. It posts to Discord when it fails.
# The shared job steps live in the shared workflow.

on:
  push:
    branches: [main]
    paths:
      - "agrag/agents/**"
      - "agrag/chunking/**"
      - "agrag/common/**"
      - "agrag/cypher/**"
      - "agrag/embedding/**"
      - "agrag/retrieval/**"
      - "agrag/ingestion/**"
      - "agrag/graphdb/**"
      - "agrag/vectordb/**"
      - "agrag/llm/**"
      - "agrag/loaders/**"
      - "agrag/eval/judge.py"
      - "agrag/eval/repeat.py"
      - "agrag/eval/settings.py"
      - "tests/integration/eval/conftest.py"
      - "tests/integration/eval/test_harness_e2e.py"
      - ".github/workflows/eval.yml"
      - ".github/workflows/eval-shared.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    name: Eval
    uses: ./.github/workflows/eval-shared.yml
    secrets: inherit
    with:
      eval_name: harness
      eval_label: Eval
      make_target: test-eval
      report_paths: pytest-eval-results.xml
      timeout_minutes: 30
      needs_services: true
      with_judge: true
