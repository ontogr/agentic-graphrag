name: Eval (shared)

# Shared body for the post-merge eval workflows. The per-eval
# wrappers own the triggers: their `push` path filters, weekly cron and
# workflow_dispatch. This file owns the shared steps: checkout, uv and Python
# setup, `make sync`, the eval run, the artifact upload and the Discord alert.
#
# A wrapper passes:
#   eval_name        Machine slug used in artifact names ("extraction").
#   eval_label       Human name used in job titles and Discord messages
#                    ("Extraction eval").
#   make_target      The eval's make target ("test-eval-extraction").
#   report_paths     Newline-separated artifact paths (report JSON, JUnit XML).
#   timeout_minutes  Job timeout as a number.
#   needs_services   true when the eval needs Neo4j (started, awaited, logged
#                    on failure, and torn down after).
#   with_judge       true when the eval uses EVAL_JUDGE_* (validated before
#                    the run; it defaults to LLM_* at the provider fallback).
#
# Callers pass only the LLM, judge, and Discord secrets each eval uses.
# Fork runs never reach these workflows: no eval runs on pull requests.

on:
  workflow_call:
    inputs:
      eval_name:
        type: string
        required: true
      eval_label:
        type: string
        required: true
      make_target:
        type: string
        required: true
      report_paths:
        type: string
        required: true
      timeout_minutes:
        type: number
        required: true
      needs_services:
        type: boolean
        default: false
      with_judge:
        type: boolean
        default: false
    secrets:
      LLM_BASE_URL:
        required: false
      LLM_API_KEY:
        required: false
      LLM_MODEL_ID:
        required: false
      EVAL_JUDGE_BASE_URL:
        required: false
      EVAL_JUDGE_API_KEY:
        required: false
      EVAL_JUDGE_MODEL_ID:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  eval:
    name: ${{ inputs.eval_label }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      UV_PYTHON: "3.12"
      # Fixed, throwaway credentials scoped to this job's own Docker network.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Started without --wait so the image pull overlaps with the uv and
      # Python setup below.
      - name: Start backend services
        if: ${{ inputs.needs_services }}
        run: docker compose -f docker/docker-compose.ci.yml up -d neo4j

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: make sync

      - name: Wait for backend services to be healthy
        if: ${{ inputs.needs_services }}
        run: docker compose -f docker/docker-compose.ci.yml up -d --wait --wait-timeout 420 neo4j

      - name: Run eval
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
          EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL || secrets.LLM_BASE_URL }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY || secrets.LLM_API_KEY }}
          EVAL_JUDGE_MODEL_ID: ${{ secrets.EVAL_JUDGE_MODEL_ID || secrets.LLM_MODEL_ID }}
          MAKE_TARGET: ${{ inputs.make_target }}
        run: |
          if [ -z "$LLM_BASE_URL" ] || [ -z "$LLM_API_KEY" ] || [ -z "$LLM_MODEL_ID" ]; then
            echo "::error::Configure LLM_BASE_URL, LLM_API_KEY, and LLM_MODEL_ID."
            exit 1
          fi
          if [ "${{ inputs.with_judge }}" = "true" ]; then
            # EVAL_JUDGE_* falls back to LLM_* above, so it can only be empty
            # when LLM_* is; the check keeps the failure message explicit.
            if [ -z "$EVAL_JUDGE_BASE_URL" ] || [ -z "$EVAL_JUDGE_API_KEY" ] || [ -z "$EVAL_JUDGE_MODEL_ID" ]; then
              echo "::error::EVAL_JUDGE_* secrets are empty and EVAL_JUDGE_* is required for this eval."
              exit 1
            fi
          fi
          make "$MAKE_TARGET"

      - name: Upload scores
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-${{ inputs.eval_name }}-scores
          path: ${{ inputs.report_paths }}
          retention-days: 90

      - name: Collect backend service logs
        if: ${{ inputs.needs_services && failure() }}
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop backend services
        if: ${{ inputs.needs_services && always() }}
        run: docker compose -f docker/docker-compose.ci.yml down -v

      - name: Notify Discord
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: >-
            ${{ inputs.eval_label }} failed on ${{ github.event_name }} for
            ${{ github.repository }}@${{ github.sha }}.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping the alert."
            exit 0
          fi
          curl --silent --show-error --fail \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input --arg content "$MESSAGE" '{content: $content}')" \
            "$WEBHOOK_URL"
