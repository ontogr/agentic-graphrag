name: Docs version

# Freezes the docs of a release tag as a version of the docs site and opens a pull request
# with the result. Merging that pull request deploys the version through docs.yml.
# Run it by hand with a tag name to redo a version.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to freeze, for example v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: docs-version-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Add the docs version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      UV_PYTHON: "3.12"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: tag
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          working-directory: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Freeze the docs of the tag
        # The committed API pages of a release are up to date: CI checks them on every change.
        run: |
          npm --prefix tag/docs ci
          cd tag/docs
          npx docusaurus docs:version "${TAG#v}"
      - name: Copy the version into main
        run: |
          version="${TAG#v}"
          docs=main/docs
          rm -rf "$docs/versioned_docs/version-$version"
          cp -r "tag/docs/versioned_docs/version-$version" "$docs/versioned_docs/"
          cp "tag/docs/versioned_sidebars/version-$version-sidebars.json" "$docs/versioned_sidebars/"
          jq --arg v "$version" '(. + [$v]) | unique | sort_by(split(".") | map(tonumber)) | reverse' \
            "$docs/versions.json" > versions.json.tmp
          mv versions.json.tmp "$docs/versions.json"
      - name: Build the site with the new version
        working-directory: main
        run: |
          make sync
          make docs-install
          make docs-build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: main
          base: main
          branch: docs-version-${{ env.TAG }}
          title: "docs: add ${{ env.TAG }} docs version"
          commit-message: "docs: add ${{ env.TAG }} docs version"
          body: "Adds the ${{ env.TAG }} docs to the version selector of the docs site. Merge to publish."
          add-paths: |
            docs/versioned_docs
            docs/versioned_sidebars
            docs/versions.json
