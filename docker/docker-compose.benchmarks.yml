# One Neo4j instance per benchmark corpus, so corpora never share a graph.
# The benchmark harness starts and stops these services itself:
#   docker compose -f docker/docker-compose.benchmarks.yml up -d --wait <service>
#   docker compose -f docker/docker-compose.benchmarks.yml down -v <service>
#
# Each service binds its Bolt port to the loopback address only. The ports match
# benchmarks/harness/services.py. The password comes from BENCH_NEO4J_PASSWORD, which
# must be set, at least 8 characters, when any compose command runs. A domain adds its services here
# and to SERVICE_PORTS.
#
# | Service                | Corpus                                       | Bolt port |
# |------------------------|----------------------------------------------|-----------|
# | fake                   | local checks of the harness, no real dataset | 7700      |
# | legal-lite             | LegalBench-RAG mini, lite                    | 7701      |
# | legal-full             | LegalBench-RAG mini, full                    | 7702      |
# | graphrag-novel-25646   | GraphRAG-Bench Novel-25646, full             | 7703      |
# | graphrag-medical-lite  | GraphRAG-Bench Medical, first extract        | 7704      |
# | graphrag-medical-full  | GraphRAG-Bench Medical, all 44 extracts      | 7705      |
# | graphrag-novel-8559    | GraphRAG-Bench Novel-8559, full              | 7706      |
# | graphrag-novel-41603   | GraphRAG-Bench Novel-41603, full             | 7707      |
# | graphrag-novel-2544    | GraphRAG-Bench Novel-2544, full              | 7708      |
# | financial-lite         | FinanceBench, lite                           | 7709      |
# | financial-full         | FinanceBench, full                           | 7710      |
# | memory-conv17          | BEAM conversation 17, lite and full          | 7711      |
# | memory-conv1           | BEAM conversation 1, full                    | 7712      |
# | memory-conv4           | BEAM conversation 4, full                    | 7713      |
# | memory-conv6           | BEAM conversation 6, full                    | 7714      |
# | memory-conv13          | BEAM conversation 13, full                   | 7715      |

name: agrag-bench

x-neo4j: &neo4j
  image: neo4j:5.26.0-community
  environment:
    NEO4J_AUTH: neo4j/${BENCH_NEO4J_PASSWORD:?set BENCH_NEO4J_PASSWORD}
  mem_limit: 4g
  healthcheck:
    test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

services:
  fake:
    <<: *neo4j
    ports:
      - "127.0.0.1:7700:7687"
    volumes:
      - agrag-bench-fake:/data

  legal-lite:
    <<: *neo4j
    ports:
      - "127.0.0.1:7701:7687"
    volumes:
      - agrag-bench-legal-lite:/data

  legal-full:
    <<: *neo4j
    ports:
      - "127.0.0.1:7702:7687"
    volumes:
      - agrag-bench-legal-full:/data

  financial-lite:
    <<: *neo4j
    ports:
      - "127.0.0.1:7709:7687"
    volumes:
      - agrag-bench-financial-lite:/data

  financial-full:
    <<: *neo4j
    ports:
      - "127.0.0.1:7710:7687"
    volumes:
      - agrag-bench-financial-full:/data
  memory-conv17:
    <<: *neo4j
    ports:
      - "127.0.0.1:7711:7687"
    volumes:
      - agrag-bench-memory-conv17:/data

  memory-conv1:
    <<: *neo4j
    ports:
      - "127.0.0.1:7712:7687"
    volumes:
      - agrag-bench-memory-conv1:/data

  memory-conv4:
    <<: *neo4j
    ports:
      - "127.0.0.1:7713:7687"
    volumes:
      - agrag-bench-memory-conv4:/data

  memory-conv6:
    <<: *neo4j
    ports:
      - "127.0.0.1:7714:7687"
    volumes:
      - agrag-bench-memory-conv6:/data

  memory-conv13:
    <<: *neo4j
    ports:
      - "127.0.0.1:7715:7687"
    volumes:
      - agrag-bench-memory-conv13:/data

  graphrag-novel-25646:
    <<: *neo4j
    ports:
      - "127.0.0.1:7703:7687"
    volumes:
      - agrag-bench-graphrag-novel-25646:/data

  graphrag-medical-lite:
    <<: *neo4j
    ports:
      - "127.0.0.1:7704:7687"
    volumes:
      - agrag-bench-graphrag-medical-lite:/data

  graphrag-medical-full:
    <<: *neo4j
    ports:
      - "127.0.0.1:7705:7687"
    volumes:
      - agrag-bench-graphrag-medical-full:/data

  graphrag-novel-8559:
    <<: *neo4j
    ports:
      - "127.0.0.1:7706:7687"
    volumes:
      - agrag-bench-graphrag-novel-8559:/data

  graphrag-novel-41603:
    <<: *neo4j
    ports:
      - "127.0.0.1:7707:7687"
    volumes:
      - agrag-bench-graphrag-novel-41603:/data

  graphrag-novel-2544:
    <<: *neo4j
    ports:
      - "127.0.0.1:7708:7687"
    volumes:
      - agrag-bench-graphrag-novel-2544:/data

volumes:
  agrag-bench-fake:
    name: agrag-bench-fake
  agrag-bench-legal-lite:
    name: agrag-bench-legal-lite
  agrag-bench-legal-full:
    name: agrag-bench-legal-full
  agrag-bench-financial-lite:
    name: agrag-bench-financial-lite
  agrag-bench-financial-full:
    name: agrag-bench-financial-full
  agrag-bench-graphrag-novel-25646:
    name: agrag-bench-graphrag-novel-25646
  agrag-bench-graphrag-medical-lite:
    name: agrag-bench-graphrag-medical-lite
  agrag-bench-graphrag-medical-full:
    name: agrag-bench-graphrag-medical-full
  agrag-bench-graphrag-novel-8559:
    name: agrag-bench-graphrag-novel-8559
  agrag-bench-graphrag-novel-41603:
    name: agrag-bench-graphrag-novel-41603
  agrag-bench-graphrag-novel-2544:
    name: agrag-bench-graphrag-novel-2544
  agrag-bench-memory-conv17:
    name: agrag-bench-memory-conv17
  agrag-bench-memory-conv1:
    name: agrag-bench-memory-conv1
  agrag-bench-memory-conv4:
    name: agrag-bench-memory-conv4
  agrag-bench-memory-conv6:
    name: agrag-bench-memory-conv6
  agrag-bench-memory-conv13:
    name: agrag-bench-memory-conv13
