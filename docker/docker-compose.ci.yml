# Local backends for GraphStore integration tests.
# The neo4j service uses the same authentication its cloud counterpart does.
# The falkordb service runs without a password, as the integration jobs expect.
# Services:
#   neo4j     Bolt on port 7687.
#   falkordb  Redis protocol on port 6379.
# Set NEO4J_BOLT_PORT or FALKORDB_PORT to publish a different host port, and
# pass -p <name> to run a second copy side by side.
# Usage:
#   docker compose -f docker/docker-compose.ci.yml up -d --wait
#   docker compose -f docker/docker-compose.ci.yml down -v

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-7961}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-7962}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/ci-test-password
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  falkordb:
    image: falkordb/falkordb:v4.22.2
    environment:
      BROWSER: "0"
      FALKORDB_ARGS: "RESULTSET_SIZE -1 TIMEOUT_MAX 3600000 MAX_QUEUED_QUERIES 25"
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
