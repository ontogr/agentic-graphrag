# Local FalkorDB for development, with the FalkorDB Browser web UI.
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d --wait
#   docker compose -f docker/docker-compose.dev.yml down
#
# Ports: FALKORDB_PORT (default 6379) serves the Redis protocol. FALKORDB_BROWSER_PORT
# (default 3000) serves the Browser at http://localhost:3000.
# Data persists in the falkordb-data volume. Run down -v to remove the volume.

services:
  qdrant:
    extends:
      file: docker-compose.ci.yml
      service: qdrant
    volumes:
      - qdrant-data:/qdrant/storage

  milvus:
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./milvus-embedded-etcd.yml:/milvus/configs/embedEtcd.yaml:ro
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_PORT:-7971}:19530"
      - "127.0.0.1:${MILVUS_HTTP_PORT:-7972}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  falkordb:
    image: falkordb/falkordb:v4.22.2
    environment:
      BROWSER: "1"
      FALKORDB_ARGS: "RESULTSET_SIZE -1 TIMEOUT_MAX 3600000 MAX_QUEUED_QUERIES 25"
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY:-dev-weaviate-key}"
      AUTHENTICATION_APIKEY_USERS: "local@example.com"
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: "local@example.com"
      DEFAULT_VECTORIZER_MODULE: "none"
      ASYNC_INDEXING: "false"
      QUERY_MAXIMUM_RESULTS: "10000"
      CLUSTER_HOSTNAME: "weaviate"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    ports:
      - "127.0.0.1:${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  milvus-data:
  falkordb-data:
  qdrant-data:
  weaviate-data:
